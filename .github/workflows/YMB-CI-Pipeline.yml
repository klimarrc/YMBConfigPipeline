# YMB Banking App CI Pipeline
# This pipeline ensures that the banking app code meets the security and quality standards required by Ben Secure.
# It also supports Ben Secure's audit requirement by providing a record of the 
# code changes and their testing.
 
name: YMB Banking App CI Pipeline
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
 
      - name: Run pytest
        run: pytest test_main.py -v
